# Comprueba cada PR y cada push a develop/main: build de todos los workspaces y pruebas.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres desechable para las pruebas de integracion de profile y analytics.
    # tests/helpers/isolated_postgres.ts solo acepta este host, puerto, base y usuario.
    # La clave cambia en cada ejecucion: es una base desechable y no hay
    # credencial fija en el repositorio.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gamification_test
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}', github.run_id, github.run_attempt) }}
          POSTGRES_DB: profile_gamification_test
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U gamification_test -d profile_gamification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PROFILE_TEST_DATABASE_URL: ${{ format('postgresql://gamification_test:ci-{0}-{1}@127.0.0.1:55437/profile_gamification_test', github.run_id, github.run_attempt) }}
      # Sin estas banderas las pruebas con Postgres se omitirian en silencio.
      PROFILE_PREFERENCES_PG_TESTS: '1'
      GAMIFICATION_PG_TESTS: '1'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Misma version de Node que los Dockerfile de los servicios.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # Ningun paquete ejecuta scripts al instalarse; bcrypt (iam) solo enlaza su binario.
      - run: npm ci --ignore-scripts
      - run: npm rebuild bcrypt

      - run: npm run build

      - run: npm test
