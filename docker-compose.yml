# Plataforma completa: gateway + servicios + una base de datos por servicio.
# Uso:  copia .env.example a .env, rellena los secretos y ejecuta  docker compose up --build
# Variables obligatorias (sin valor por defecto): JWT_SECRET, POSTGRES_PASSWORD,
#   MONGO_ROOT_PASSWORD y RABBITMQ_PASSWORD. Usa contraseñas sin caracteres especiales de URL
#   (@ : / ? #) porque van dentro de MONGO_URL y RABBITMQ_URL.
# Puertos en el host: solo el gateway (8080). Para depurar, postgres (5433-5437), mongo (27017)
#   y la UI de rabbitmq (15672) se enlazan unicamente a 127.0.0.1. El AMQP (5672) y los
#   servicios (3001-3005) no se publican.
# Esquemas: los .sql montados en initdb SOLO se aplican al crear el volumen. En un volumen que ya
#   existe hay que aplicar a mano las migraciones nuevas (con la plataforma levantada):
#   docker compose exec -T postgres-iam       psql -U postgres -d iam       < services/iam-service/db/009_outbox_events.sql
#   docker compose exec -T postgres-iam       psql -U postgres -d iam       < services/iam-service/db/010_users_password_nullable.sql
#   docker compose exec -T postgres-iam       psql -U postgres -d iam       < services/iam-service/db/011_account_deletion_token.sql
#   docker compose exec -T postgres-analytics psql -U postgres -d analytics < services/analytics-service/db/002_erased_users.sql
#   docker compose exec -T postgres-profile   psql -U postgres -d profile   < services/profile-service/db/002_erased_users.sql
#   docker compose exec -T postgres-profile   psql -U postgres -d profile   < services/profile-service/db/003_ui_languages.sql
#   docker compose exec -T postgres-profile   psql -X -v ON_ERROR_STOP=1 -U postgres -d profile < services/profile-service/db/004_achievement_catalog.sql
#   docker compose exec -T postgres-profile   psql -X -v ON_ERROR_STOP=1 -U postgres -d profile < services/profile-service/db/005_obtainable_achievements.sql
#   docker compose exec -T postgres-profile   psql -X -v ON_ERROR_STOP=1 -U postgres -d profile < services/profile-service/db/006_translation_milestones.sql
#   docker compose exec -T postgres-profile   psql -X -v ON_ERROR_STOP=1 -U postgres -d profile < services/profile-service/db/007_admin_reports.sql
#   docker compose exec -T postgres-recognition psql -U postgres -d recognition < services/recognition-service/db/003_erased_users.sql
#   (si 009 ya se aplico con una version anterior, volver a ejecutarla: es idempotente y anade las columnas nuevas)
# Orden de despliegue de iam.UserDeleted: el outbox publica con mandatory=true, asi que un evento sin
#   cola destino FALLA y se reintenta (no se pierde). Aun asi, levanta/despliega primero los consumidores
#   (recognition, analytics, profile: crean sus colas *.user-deleted al arrancar) y despues iam.

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  environment: &postgres-env
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env o exportalo}

x-service-env: &service-env
  JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (minimo 32 caracteres) en .env o exportalo}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-signa}:${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env o exportalo}@rabbitmq:5672
  DB_USER: postgres
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env o exportalo}
  DB_PORT: "5432"

services:
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Lista blanca CORS (el contenedor corre en produccion: sin valor no se permite ningun origen web).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:19006}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (minimo 32 caracteres) en .env o exportalo}
      IAM_SERVICE_URL: http://iam-service:3001
      RECOGNITION_SERVICE_URL: http://recognition-service:3002
      LEXICON_SERVICE_URL: http://lexicon-service:3003
      ANALYTICS_SERVICE_URL: http://analytics-service:3004
      PROFILE_SERVICE_URL: http://profile-service:3005
    depends_on:
      - iam-service
      - lexicon-service
    restart: unless-stopped

  iam-service:
    build:
      context: .
      dockerfile: services/iam-service/Dockerfile
    environment:
      <<: *service-env
      PORT: "3001"
      DB_HOST: postgres-iam
      DB_NAME: iam
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
    depends_on:
      postgres-iam:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  recognition-service:
    build:
      context: .
      dockerfile: services/recognition-service/Dockerfile
    environment:
      <<: *service-env
      PORT: "3002"
      DB_HOST: postgres-recognition
      DB_NAME: recognition
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-signa}:${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env o exportalo}@mongo:27017/recognition?authSource=admin
    depends_on:
      postgres-recognition:
        condition: service_healthy
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  lexicon-service:
    build:
      context: .
      dockerfile: services/lexicon-service/Dockerfile
    environment:
      <<: *service-env
      PORT: "3003"
      DB_HOST: postgres-lexicon
      DB_NAME: lexicon
      # LEXICON_MEDIA_BASE_URL: https://cdn.ejemplo.com/lexicon
    depends_on:
      postgres-lexicon:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    environment:
      <<: *service-env
      PORT: "3004"
      DB_HOST: postgres-analytics
      DB_NAME: analytics
    depends_on:
      postgres-analytics:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  profile-service:
    build:
      context: .
      dockerfile: services/profile-service/Dockerfile
    environment:
      <<: *service-env
      PORT: "3005"
      DB_HOST: postgres-profile
      DB_NAME: profile
      # Resumenes IN_APP para administradores: leen estadisticas por HTTP interno.
      RECOGNITION_URL: http://recognition-service:3002
      ANALYTICS_URL: http://analytics-service:3004
      ADMIN_REPORTS_ENABLED: ${ADMIN_REPORTS_ENABLED:-true}
      ADMIN_REPORTS_TICK_MS: ${ADMIN_REPORTS_TICK_MS:-900000}
    depends_on:
      postgres-profile:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres-iam:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: iam
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-iam-data:/var/lib/postgresql/data
      # Esquema de usuarios, RBAC y codigos de un solo uso: se aplica al crear el volumen por primera vez.
      - ./services/iam-service/db/000_users.sql:/docker-entrypoint-initdb.d/000_users.sql:ro
      - ./services/iam-service/db/003_iam_roles_permissions.sql:/docker-entrypoint-initdb.d/003_iam_roles_permissions.sql:ro
      - ./services/iam-service/db/005_auth_email_normalization_user_tokens.sql:/docker-entrypoint-initdb.d/005_auth_email_normalization_user_tokens.sql:ro
      - ./services/iam-service/db/006_users_status_email_verification.sql:/docker-entrypoint-initdb.d/006_users_status_email_verification.sql:ro
      # Outbox de eventos (UserDeleted, ...): se publican con reintentos desde el relay de iam.
      - ./services/iam-service/db/009_outbox_events.sql:/docker-entrypoint-initdb.d/009_outbox_events.sql:ro
      # Cuentas de Google sin contraseña: password admite NULL.
      - ./services/iam-service/db/010_users_password_nullable.sql:/docker-entrypoint-initdb.d/010_users_password_nullable.sql:ro
      # Codigo por correo para borrar cuentas sin contraseña (token ACCOUNT_DELETION).
      - ./services/iam-service/db/011_account_deletion_token.sql:/docker-entrypoint-initdb.d/011_account_deletion_token.sql:ro
      # Reserva con token en el outbox: un relay vencido no confirma la reserva de otro.
      - ./services/iam-service/db/012_outbox_claim_token.sql:/docker-entrypoint-initdb.d/012_outbox_claim_token.sql:ro
    healthcheck: &pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-recognition:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: recognition
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pg-recognition-data:/var/lib/postgresql/data
      # Esquema (translations, sign_templates): se aplica al crear el volumen por primera vez.
      - ./services/recognition-service/db/001_translations.sql:/docker-entrypoint-initdb.d/001_translations.sql:ro
      - ./services/recognition-service/db/002_sign_templates.sql:/docker-entrypoint-initdb.d/002_sign_templates.sql:ro
      - ./services/recognition-service/db/003_erased_users.sql:/docker-entrypoint-initdb.d/003_erased_users.sql:ro
    healthcheck: *pg-healthcheck

  postgres-lexicon:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: lexicon
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pg-lexicon-data:/var/lib/postgresql/data
      # Esquema y semilla del alfabeto: se aplican al crear el volumen por primera vez.
      - ./services/lexicon-service/db/003_lexicon.sql:/docker-entrypoint-initdb.d/003_lexicon.sql:ro
    healthcheck: *pg-healthcheck

  postgres-analytics:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: analytics
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - pg-analytics-data:/var/lib/postgresql/data
      # Esquema: se aplica al crear el volumen por primera vez.
      - ./services/analytics-service/db/001_usage_event.sql:/docker-entrypoint-initdb.d/001_usage_event.sql:ro
      - ./services/analytics-service/db/002_erased_users.sql:/docker-entrypoint-initdb.d/002_erased_users.sql:ro
    healthcheck: *pg-healthcheck

  postgres-profile:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: profile
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - pg-profile-data:/var/lib/postgresql/data
      # Esquema y semilla de logros: se aplican al crear el volumen por primera vez.
      - ./services/profile-service/db/001_profile.sql:/docker-entrypoint-initdb.d/001_profile.sql:ro
      - ./services/profile-service/db/002_erased_users.sql:/docker-entrypoint-initdb.d/002_erased_users.sql:ro
      # Idioma de la interfaz: ES, EN, FR y PT.
      - ./services/profile-service/db/003_ui_languages.sql:/docker-entrypoint-initdb.d/003_ui_languages.sql:ro
      - ./services/profile-service/db/004_achievement_catalog.sql:/docker-entrypoint-initdb.d/004_achievement_catalog.sql:ro
      - ./services/profile-service/db/005_obtainable_achievements.sql:/docker-entrypoint-initdb.d/005_obtainable_achievements.sql:ro
      - ./services/profile-service/db/006_translation_milestones.sql:/docker-entrypoint-initdb.d/006_translation_milestones.sql:ro
      # Resumenes y recordatorios para administradores.
      - ./services/profile-service/db/007_admin_reports.sql:/docker-entrypoint-initdb.d/007_admin_reports.sql:ro
    healthcheck: *pg-healthcheck

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-signa}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env o exportalo}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-signa}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env o exportalo}
    ports:
      # Solo la UI de administracion y solo en local; el AMQP queda en la red interna.
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # check_port_connectivity: el listener AMQP abre despues de que "ping" ya responde
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pg-iam-data:
  pg-recognition-data:
  pg-lexicon-data:
  pg-analytics-data:
  pg-profile-data:
  mongo-data:
  rabbitmq-data:
